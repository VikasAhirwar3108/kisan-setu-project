{% extends 'base.html' %}{% block content %}<h1>My Orders</h1>{% if orders %}<div class="tablewrap"><table><tr><th>Order</th><th>Date</th><th>Total</th><th>Payment</th><th>Status</th><th>Track</th></tr>{% for o in orders %}<tr><td>#{{ o.id }}</td><td>{{ o.created_at }}</td><td>₹{{ '%.2f'|format(o.total) }}</td><td>{{ o.payment_status }}</td><td>{{ o.status }}</td><td><a href="{{ url_for('track',oid=o.id) }}">Track</a></td></tr>{% endfor %}</table></div>{% else %}<div class="empty">No orders yet.</div>{% endif %}{% endblock %}
