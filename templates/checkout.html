{% extends 'base.html' %}{% block content %}<form class="form" method="post"><h1>Checkout</h1><p>Subtotal ₹{{ '%.2f'|format(subtotal) }} · Delivery ₹{{ '%.2f'|format(delivery_fee) }} · <b>Total ₹{{ '%.2f'|format(total) }}</b></p><label>Delivery address</label><textarea name="address" required></textarea><label>State</label><select name="state" id="state">{% for s in states %}<option>{{ s }}</option>{% endfor %}</select><label>City</label><select name="city" id="city">{% for c in locations[states[0]] %}<option>{{ c }}</option>{% endfor %}</select><label>PIN code</label><input name="pincode" pattern="[0-9]{6}" required><label>Payment method</label><select name="payment_method"><option value="cod">Cash on Delivery</option><option value="razorpay">Razorpay</option><option value="upi">UPI (gateway required)</option><option value="card">Card (gateway required)</option><option value="netbanking">Net Banking (gateway required)</option></select><button style="margin-top:16px;width:100%">Place Order</button></form><script>const locations={{ locations|tojson }};const s=document.getElementById('state'),c=document.getElementById('city');function fill(){c.innerHTML='';(locations[s.value]||[]).forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;c.appendChild(o)})}s.addEventListener('change',fill);</script>{% endblock %}
