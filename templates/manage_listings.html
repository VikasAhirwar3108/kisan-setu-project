{% extends 'base.html' %}{% block content %}<h1>My Listings</h1><div class="tablewrap"><table><tr><th>Product</th><th>Price</th><th>Stock</th><th>Status</th><th>Action</th></tr>{% for p in products %}<tr><td>{{ p.name }}</td><td>₹{{ p.price }}</td><td>{{ p.stock }} {{ p.unit }}</td><td>{{ 'Active' if p.active else 'Hidden' }}</td><td><form method="post" action="{{ url_for('toggle_listing',pid=p.id) }}"><button class="btn alt">Toggle</button></form></td></tr>{% else %}<tr><td colspan="5">No listings yet.</td></tr>{% endfor %}</table></div>{% endblock %}
