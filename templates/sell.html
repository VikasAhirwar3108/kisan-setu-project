{% extends 'base.html' %}{% block content %}<form class="form" method="post"><h1>List a product</h1><label>Product name</label><input name="name" required><label>Category</label><select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select><label>Description</label><textarea name="description"></textarea><label>Price (₹)</label><input type="number" name="price" min="0.01" step="0.01" required><label>Stock</label><input type="number" name="stock" min="0.1" step="0.1" required><label>Unit</label><select name="unit"><option>kg</option><option>piece</option><option>pack</option><option>litre</option></select><label>State</label><select name="state" id="state">{% for s in states %}<option>{{ s }}</option>{% endfor %}</select><label>City</label><select name="city" id="city">{% for c in locations[states[0]] %}<option>{{ c }}</option>{% endfor %}</select><button style="margin-top:15px">Publish listing</button></form><script>const locations={{ locations|tojson }};const s=document.getElementById('state'),c=document.getElementById('city');function fill(){c.innerHTML='';(locations[s.value]||[]).forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;c.appendChild(o)})}s.addEventListener('change',fill)</script>{% endblock %}
