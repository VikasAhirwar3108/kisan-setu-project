{% extends 'base.html' %}{% block content %}<h1>Driver Desk</h1>{% for o in orders %}<form class="form" method="post" action="{{ url_for('driver_update',oid=o.id) }}" style="max-width:100%;margin-bottom:15px"><h2>Order #{{ o.id }} · ₹{{ o.total }}</h2><p>{{ o.address }}, {{ o.city }}, {{ o.state }} {{ o.pincode }}</p><label>Status</label><select name="status">{% for s in ['Placed','Confirmed','Packed','Out for delivery','Delivered','Cancelled'] %}<option {% if o.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select><label>Driver name</label><input name="driver_name" value="{{ o.driver_name }}"><label>Driver phone</label><input name="driver_phone" value="{{ o.driver_phone }}"><label>Vehicle number</label><input name="vehicle_number" value="{{ o.vehicle_number }}"><div class="row"><div><label>Latitude</label><input name="lat" value="{{ o.driver_lat or '' }}"></div><div><label>Longitude</label><input name="lon" value="{{ o.driver_lon or '' }}"></div></div><button style="margin-top:12px">Save delivery update</button></form>{% else %}<div class="empty">No active deliveries.</div>{% endfor %}{% endblock %}
