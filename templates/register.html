{% extends 'base.html' %}{% block content %}<form class="form" method="post"><h1>Create account</h1><label>Full name</label><input name="name" required><label>Username (minimum 4 characters)</label><input name="username" required minlength="4"><label>Password (minimum 6 characters)</label><input type="password" name="password" required minlength="6"><label>Account type</label><select name="role"><option value="buyer">Buyer</option><option value="farmer">Farmer</option><option value="driver">Delivery Driver</option></select><label>Phone</label><input name="phone"><label>State</label><select name="state" id="state" required>{% for s in states %}<option>{{ s }}</option>{% endfor %}</select><label>City</label><select name="city" id="city" required>{% for c in locations[states[0]] %}<option>{{ c }}</option>{% endfor %}</select><button style="width:100%;margin-top:18px">Register</button></form><script>const locations={{ locations|tojson }};const s=document.getElementById('state'),c=document.getElementById('city');function fill(){c.innerHTML='';(locations[s.value]||[]).forEach(x=>{let o=document.createElement('option');o.textContent=x;o.value=x;c.appendChild(o)})}s.addEventListener('change',fill);</script>{% endblock %}
